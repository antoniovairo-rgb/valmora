name: catene
on:
  push:
    # PO 16/10: i rami dei collaudi contengono solo rapporti e sonde, mai codice di gioco, e non si uniscono:
    # la CI lì produceva solo mail «Run failed» (C-030, controllo «modello» sui commit della collaudatrice).
    branches-ignore:
      - 'claude/valmora-collaudo-*'
  pull_request:
jobs:
  governo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/catena.mjs governo
  logica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node tools/catena.mjs logica
  grafica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: node tools/catena.mjs grafica
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foto
          path: out/foto
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx vite build
      - run: npx cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: valmora-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      # Su main l'APK va anche nella release «apk-debug»: indirizzo fisso per il link nel gioco (D-046)
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk valmora-debug.apk
          gh release view apk-debug >/dev/null 2>&1 || gh release create apk-debug --prerelease --title "APK di prova (debug)" --notes "APK di debug, ricostruito a ogni pubblicazione su main. Non è la versione per il Play Store."
          gh release upload apk-debug valmora-debug.apk --clobber
          gh release edit apk-debug --notes "APK di debug costruito da main ${GITHUB_SHA::7}. Non è la versione per il Play Store."
