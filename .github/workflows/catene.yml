name: catene
on:
  push:
    # PO 16/10: i rami dei collaudi contengono solo rapporti e sonde, mai codice di gioco, e non si uniscono:
    # la CI lì produceva solo mail «Run failed» (C-030, controllo «modello» sui commit della collaudatrice).
    branches-ignore:
      - 'claude/valmora-collaudo-*'
  pull_request:
jobs:
  # PO-128: i commit che toccano SOLO docs/**, coordination/** o STABILITA.json non fanno girare logica, grafica e apk
  # (erano la maggior parte delle mail «Run failed»: rosso instabile della grafica su commit senza gioco). «governo»
  # gira sempre: controlla proprio i documenti. Ramo nuovo o diff non calcolabile: gira tutto. D-115 resta valido:
  # il commit della versione tocca sempre src/versione.ts.
  cambi:
    runs-on: ubuntu-latest
    outputs:
      gioco: ${{ steps.diff.outputs.gioco }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          PRIMA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node tools/cambi-gioco.mjs "$PRIMA" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
  governo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/catena.mjs governo
  logica:
    needs: cambi
    if: needs.cambi.outputs.gioco != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node tools/catena.mjs logica
  # PO-128: una larghezza per job, in parallelo. Stessa copertura (le larghezze sono giri indipendenti di tools/foto.mjs),
  # tempo del job circa un terzo: misura del 17/10, foto 3 larghezze = ~28 min per tentativo su un solo job.
  # D-202: la 360 ha in più apriTutte, ripartenze e i bracci rossi (41 min su un job): si divide in tre job con
  # VALMORA_PASSI (stessi passi, stessi controlli, ognuno su un runner). Il runner è limitato dalla CPU (Chrome disegna
  # le mappe WebGL in software): più pagine sullo stesso job rendono poco, più job sì.
  grafica:
    name: grafica (${{ matrix.larghezza }}${{ matrix.parte && format(' {0}', matrix.parte) || '' }})
    needs: cambi
    if: needs.cambi.outputs.gioco != 'false'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { larghezza: 360, parte: foto, passi: 'token,build,email,foto' }
          - { larghezza: 360, parte: schieramenti, passi: 'build,schieramenti,offline,altezze' }
          - { larghezza: 360, parte: bracci, passi: 'build,bracci-rossi-grafica' }
          - { larghezza: 375 }
          - { larghezza: 412 }
    env:
      VALMORA_LARGHEZZE: ${{ matrix.larghezza }}
      VALMORA_PASSI: ${{ matrix.passi }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: node tools/catena.mjs grafica
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foto-${{ matrix.larghezza }}${{ matrix.parte && format('-{0}', matrix.parte) || '' }}
          path: out/foto
  apk:
    needs: cambi
    if: needs.cambi.outputs.gioco != 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx vite build
      - run: npx cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: valmora-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      # Su main l'APK va anche nella release «apk-debug»: indirizzo fisso per il link nel gioco (D-046)
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk valmora-debug.apk
          gh release view apk-debug >/dev/null 2>&1 || gh release create apk-debug --prerelease --title "APK di prova (debug)" --notes "APK di debug, ricostruito a ogni pubblicazione su main. Non è la versione per il Play Store."
          gh release upload apk-debug valmora-debug.apk --clobber
          gh release edit apk-debug --notes "APK di debug costruito da main ${GITHUB_SHA::7}. Non è la versione per il Play Store."
  # D-212/D-214 (PO-144): AAB di rilascio. Job separato: non tocca gli altri 9 e gira sempre. Nessun segreto e nessuna
  # firma: l'AAB esce NON firmato e serve solo a controllare che la build riesca (il PO firma in locale con Android Studio).
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx vite build
      - run: npx cap sync android
      - run: ./gradlew bundleRelease --no-daemon
        working-directory: android
      - name: controllo dell'AAB (tools/aab.mjs)
        # PO-145 (D-217): su main (rilascio) il contatto della privacy policy non può essere il segnaposto
        env:
          VALMORA_RILASCIO: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}
        run: |
          set -o pipefail
          curl -sSfL -o "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
          node tools/aab.mjs android/app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/bundletool.jar"
          if unzip -Z1 android/app/build/outputs/bundle/release/app-release.aab | grep -qE '^META-INF/[^/]+\.(RSA|EC|DSA)$'; then echo "AAB FIRMATO"; else echo "::warning::AAB NON FIRMATO (atteso, D-214): serve solo a controllare la build"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: valmora-release-aab-non-firmato
          path: android/app/build/outputs/bundle/release/app-release.aab
