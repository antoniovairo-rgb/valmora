apply plugin: 'com.android.application'

// D-212 (PO-144): versione di rilascio derivata da GAME_VERSION in src/versione.ts.
// Regola: versionCode = maggiore * 1000000 + minore * 1000 + correzione (ognuno 0-999), versionName = GAME_VERSION.
// Cresce con la versione: 0.46.0 -> 46000, 0.47.0 -> 47000, 1.0.0 -> 1000000. Stessa regola in tools/aab.mjs.
def versioneGioco = {
    def testo = rootProject.file('../src/versione.ts').text
    def m = testo =~ /export const GAME_VERSION = '(\d+)\.(\d+)\.(\d+)';/
    if (!m.find()) throw new GradleException('GAME_VERSION non trovata in src/versione.ts')
    def (maggiore, minore, correzione) = [m.group(1), m.group(2), m.group(3)].collect { it as int }
    if ([minore, correzione].any { it > 999 }) throw new GradleException("GAME_VERSION ${m.group(0)}: minore e correzione devono stare in 0-999")
    [codice: maggiore * 1000000 + minore * 1000 + correzione, nome: "${maggiore}.${minore}.${correzione}".toString()]
}()
// D-214: nessuna firma nel repository. Il PO firma in locale con Build > Generate Signed Bundle di Android Studio;
// la CI produce l'AAB non firmato solo per controllare che la build riesca.

android {
    namespace = "io.github.antoniovairo.varcalda"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.antoniovairo.varcalda"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// D-212: la versione derivata vale solo per il rilascio; il debug (job «apk») resta versionCode 1 / "1.0" come prima.
androidComponents {
    onVariants(selector().withBuildType('release')) { variante ->
        variante.outputs.each { uscita ->
            uscita.versionCode.set(versioneGioco.codice)
            uscita.versionName.set(versioneGioco.nome)
        }
    }
}

gradle.taskGraph.whenReady { grafo ->
    if (grafo.allTasks.any { it.name in ['bundleRelease', 'assembleRelease'] }) {
        logger.lifecycle("VALMORA rilascio: versionName ${versioneGioco.nome}, versionCode ${versioneGioco.codice}")
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
